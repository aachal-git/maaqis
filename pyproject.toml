[project]
name = "maaqis"
version = "1.0.0"
description = "Multi-Agent Air Quality Intelligence System - OpenEnv Environment"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pydantic",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:BuildBackend"